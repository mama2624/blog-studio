name: 실시간 키워드 수집

# 작업실 오른쪽 '실시간 키워드' 패널이 읽는 data/realtime-trends.json 을 매시 10분에 갱신한다.
# 무료 공개 소스(구글 트렌드·시그널·네이버·네이트·연예/건강 RSS)만 쓰고, 유료 API 키는 없다.
on:
  schedule:
    - cron: "10 * * * *"      # 매시 10분 (UTC 기준이라 한국시간과 무관하게 매시 정각+10분)
  workflow_dispatch:           # 필요할 때 손으로 한 번 돌리기

permissions:
  contents: write              # 갱신된 JSON 을 저장소에 커밋하기 위해 필요

concurrency:
  group: realtime-trends
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 실시간 키워드 수집
        run: python3 tools/fetch_realtime_trends.py

      - name: 바뀐 게 있을 때만 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/realtime-trends.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          STAMP=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')
          git commit -m "chore: 실시간 키워드 갱신 ${STAMP} KST"
          git push
